name: CI-CD

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: rms
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/rms
      JWT_SECRET: ci-secret-ci-secret-ci-secret-ci-secret-1234
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements.txt
      - run: pip install -r requirements.txt
      - name: Buat database tes
        run: >
          python -c "import pymysql;
          c=pymysql.connect(host='127.0.0.1',user='root',password='root');
          c.cursor().execute('CREATE DATABASE IF NOT EXISTS rms_test');
          c.commit()"
      - run: python -m pytest -q

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency: vps-deploy
    steps:
      - name: Deploy ke VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 20m
          script: bash /opt/rms/deploy.sh
      - name: Cek kesehatan dari luar
        run: curl -fsS --retry 5 --retry-delay 5 --retry-all-errors https://rms-api.fztama.my.id/health